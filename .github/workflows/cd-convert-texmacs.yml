name: continuous deployment for gh-pages (with texmacs-cd image)

on:
  push:
    branches:
      - main

# Use an on demand workflow trigger.  
#on: workflow_dispatch

# Builds push to main and gh-pages: never run two at once.
concurrency:
  group: cd-gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/texmacs/texmacs-2.1.4-cd:main.20241119.234058.192z
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # full history: notes-tools.scm dates each article from git log
          fetch-depth: 0

      - name: Run TeXmacs script with headless option
        run: |
          # add safe directory (texmacs script uses git to obtain metadata)
          git config --global --add safe.directory $PWD

          # run texmacs scripts
          texmacs_bin=$(which texmacs)
          $texmacs_bin -headless -x '(begin (load "notes-tools.scm") (notes-update) (quit))'

      - name: Post-process and check the generated HTML
        run: |
          command -v python3 || (apt-get update && apt-get install -y python3)
          python3 tools/postprocess_site.py
          python3 -m unittest discover -s tools -p 'test_*.py'
          find tools -name __pycache__ -exec rm -rf {} +

      - name: Commit changes to main and deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # set variable
          TARGET_BRANCH="gh-pages"
          BUILD_DIR="docs"
          RESOURCES_DIR="resources"
          MISC_DIR="misc"
          ROOT_INDEX_FILE="index.html"
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          
          # add safe directory
          git config --global --add safe.directory $PWD

          # set Git config
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

          # commit & push to main, only if the build changed something
          git add --all
          if git diff --cached --quiet; then
            echo "Build output already up to date on main."
          else
            git commit -m "CD build"
            git push
          fi

          # init gh-pages branch
          git clone --branch ${TARGET_BRANCH} --depth 1 ${REPO_URL} gh-pages || \
          (git init gh-pages && cd gh-pages && git checkout --orphan ${TARGET_BRANCH})
          cd gh-pages
          
          # remove old file
          rm -rf *
          
          # copy 'docs' 
          cp -r ../${BUILD_DIR} .
          
          # copy 'resources' 
          cp -r ../${RESOURCES_DIR} .

          # copy 'misc' (icons referenced by older feed copies)
          cp -r ../${MISC_DIR} .

          # copy 'index.html', '404.html' and 'sitemap.xml'
          cp ../${ROOT_INDEX_FILE} ../404.html ../sitemap.xml .

          # commit & push, only if the site changed
          git add --all
          if git diff --cached --quiet; then
            echo "${TARGET_BRANCH} already up to date."
          else
            git commit -m "Deploy to ${TARGET_BRANCH} branch"
            git push --force ${REPO_URL} ${TARGET_BRANCH}
          fi
